<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>푸드타임</title>

    <style>
        body {
            margin: 0;
            font-family: "Arial", sans-serif;
            background-color: #fff7f0;
            color: #333;
        }

        header {
            background-color: #ff9a76;
            color: white;
            text-align: center;
            padding: 25px;
            font-size: 28px;
            font-weight: bold;
        }

        .container {
            padding: 20px;
        }

        .food-card {
            background-color: white;
            margin: 15px 0;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .food-card img {
            width: 50%;
            border-radius: 10px;
            height: 450px;
            object-fit: cover;
        }

        .food-title {
            font-size: 20px;
            margin: 10px 0;
            font-weight: bold;
        }

        .food-desc {
            font-size: 14px;
            color: #666;
        }

        footer {
            text-align: center;
            padding: 15px;
            background-color: #ff9a76;
            color: white;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <header>
        🍔 푸드타임 · Food Time
    </header>

    <div class="container">

        <div class="food-card">
            <img src="피자.jpg" alt="피자">
            <div class="food-title">치즈 피자</div>
            <div class="food-desc">진한 치즈와 바삭바삭한 팬케이크가 어우러져 한입에 쏙쏙 들어옵니다.</div>
        </div>

        <div class="food-card">
            <img src="일본식 초밥.jpg" alt="일본식 초밥">
            <div class="food-title">일본식 초밥</div>
            <div class="food-desc">신선한 재료, 상큼한 식감, 건강하고 맛있습니다.</div>
        </div>

        <div class="food-card">
            <img src="건강 샐러드.jpg" alt="건강 샐러드">
            <div class="food-title">건강 샐러드</div>
            <div class="food-desc">저지방에 영양가 있고 가벼운 음식과 저지방 사람들에게 적합</div>
        </div>

    </div>

    <footer>
        🍽️ 삶을 즐기며 맛있는 음식부터
    </footer>

</body>
</html>
