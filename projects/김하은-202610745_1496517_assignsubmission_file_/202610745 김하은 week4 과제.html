<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>202610745 김하은 week4</title>
    <style>
        body {
            margin: 0;
            background-image: url(https://img.freepik.com/free-photo/blue-sky-with-cloud-closeup_1127-2309.jpg?semt=ais_hybrid&w=740&q=80);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }

        .cloud-container {
            display: flex;         
            gap: 20px;           
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
        }

        .cloud-item {
            color: white;
            text-align: center;
            width: 300px;           
        }

        .cloud-item h2 {
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5); 
        }

        
        .cloud-item img {
            width: 100%;           
            height: 200px;          
            object-fit: cover;      
            border-radius: 10px;    
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .cloud-item p {
            background-color: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <div class="cloud-container">
        <div class="cloud-item">
            <h2>1. 적운</h2>
            <img src="https://images.unsplash.com/photo-1592830834426-5147d148e4c4?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8JUVDJUEwJTgxJUVDJTlBJUI0fGVufDB8fDB8fHww" alt="적운">
            <p>뭉게구름이라고도 불리며, 맑은 날에 자주 보이는 솜사탕 같은 구름입니다.</p>
        </div>

        <div class="cloud-item">
            <h2>2. 적란운</h2>
            <img src="https://i.namu.wiki/i/w6XgOe8JuzCwyHMyzEbUawEJncpmj_8zaXaph_vovqYJ8qMFh9vgwKk2w4WC4ZM1BHLcMQZVrJazGoZaC21lkA.webp" alt="적란운">
            <p>수직으로 높게 자란 거대한 구름으로, 소나기나 번개를 동반하는 경우가 많습니다.</p>
        </div>
    </div>
</body>
</html>
