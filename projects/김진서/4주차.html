<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>koenigsegg</title>
  <link rel="stylesheet" href="style_01.css">
  <style>

    body, h1, h2, h3, h4, h5, h6, p , span { margin: 0; padding: 0;}

    .section1 {
      background-image: url(https://wallpapercave.com/wp/wp12165501.jpg);
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      height: 100vh;
      position: relative;
    }
    .section1 img {
      position: absolute;
      top: 10%;         
      width: 25%;
      left: 35%;
      height: auto;
 
    }

    .section1 text {
      color: white;
    }

    .section2 {
      background-image: url(https://wallpapercave.com/wp/wp15618803.jpg);
      background-size: cover;
      background-repeat: no-repeat;
      background-position: bottom;
      height: 100vh;
    }

    .section2 details {
     position: absolute;
     top: 140%;
     left: 13%;
     transform: translate(-50%, -50%);
     color: white;
     text-align: center;
    }

    .section2 details:nth-of-type(2) {
    left: 85%;
    transform: translate(-50%, -50%);
    }


    .section2 summary .title:hover {
    color: rgb(171, 171, 171); 
    }

    .section2 summary {
    list-style: none;
    cursor: pointer;
    }

    .section2 .title {
     font-size: 40px;
     font-weight: bold;
    }

    .section2 p {
     font-size: 30px;
     margin-top: 10px;
    }

    .section2-1 details {
     position: absolute;
     top: 140%;
     left: 13%;
     transform: translate(-50%, -50%);
     color: white;
     text-align: center;
    }

    .section2-1 summary .title:hover {
    color: rgb(171, 171, 171); 
    }

    .section2-1 summary {
    list-style: none;
    cursor: pointer;
    }

    .section2-1 .title {
     font-size: 40px;
     font-weight: bold;
    }

    .section2-1 p {
     font-size: 30px;
     margin-top: 10px;
    }


  </style>
</head>
<body>
  <div class="section1">
    <a href="https://www.koenigsegg.com/home" target="_blank" style="text-decoration: none;">
    <img src="https://cdn.worldvectorlogo.com/logos/koenigsegg-logo.svg" alt="Koenigsegg Logo" />
    </a>
  </div>
  
  <div class="section2">
  <details>
    <summary><span class="title">Jesko Attack</span></summary>
    <p>2019년 출시</p>
  </details>

  <details>
    <summary><span class="title">사양</span></summary>
    <p>엔진: V8 트윈터보<br>미션: 9단 LST<br>출력: 1600마력<br>최고속도: 482km/h<br>전장 : 4,610mm<br>전폭 : 2,030mm<br>전고 : 1,210mm<br>중량 1,420kg</p>
  </details>
  
  
  <div class="section3">

  </div>

</body>
</html>
