<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>불사 끊기</title>
<style>
body { margin:0; color:white; font-family:Arial; background:url(https://i.namu.wiki/i/YMXju6o0OHNFax_5vvw0hVK4C_-qKmO-4MzaEPgkBPLBuddIYsZuqUPsdRkxuvmXOrnAEpZS8MrsFEs7-EmUejNGEySswm7IYmNxagO22V3uKaKJ_OYPenSYOmYRbZNQ3yIYVFAypCY3inYxcckQRA.webp) center; }
.section { height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; opacity:0; transform:translateY(50px); transition:1s; }
.section.show { opacity:1; transform:translateY(0); }
a { color:red; }
</style>
</head>
<body>
<div class="section"><h1>"내 한평생의 닌자여, 불사 끊기를 부탁할 수 있겠는가?"</h1></div>
<div class="section"><h2>분기 조건</h2><p>기본 루트 진행 시</p></div>
<div class="section"><h2>엔딩 설명</h2><p>쿠로를 위해 자신의 생명을 희생하는 기본 엔딩</p></div>
<div class="section"><iframe width="700" height="400" src="https://www.youtube.com/embed/DLsssDFlTXE?t=3000s"></iframe></div>
<div class="section"><a href="index.html">← 메인으로</a></div>
<script>
const sections=document.querySelectorAll('.section');
window.addEventListener('scroll',()=>{
 sections.forEach(sec=>{
  if(sec.getBoundingClientRect().top<window.innerHeight-100){ sec.classList.add('show'); }
 });
});
</script>
</body>
</html>
