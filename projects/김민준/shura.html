    <!DOCTYPE html>
    <html lang="ko">
    <head>
    <meta charset="UTF-8">
    <title>수라 엔딩</title>
    <style>
    body { margin:0; color:white; font-family:Arial; background:url(https://i.namu.wiki/i/CJMSmS3XNouoxQqp8QaXSNAMkQi5yXHutgl6r0vQjgaYQYVGcx1Ru4BtvvDUVfxFClbKxP84_BnNOX9Imn2ngVzBBoiLpXtZ5dl6puruM5EtfkJ-wIIp6JGThWBHZzx85e5SgqNhJDyuMuzKRG5m2A.webp) center; }
    .section { height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; opacity:0; transform:translateY(50px); transition:1s; }
    .section.show { opacity:1; transform:translateY(0); }
    a { color:red; }
    </style>
    </head>
    <body>
    <div class="section"><h1>"⋯아니야, 그대는⋯ 그대는 수라가 아니다⋯!"
    </h1></div>
    <div class="section"><h2>분기 조건</h2><p>의부의 편을 선택하면 발생</p></div>
    <div class="section"><h2>엔딩 설명</h2><p>늑대가 인간성을 잃고 수라가 되는 가장 비극적인 엔딩</p></div>
    <div class="section"><iframe width="700" height="400" src="https://www.youtube.com/embed/DLsssDFlTXE?t=3000s"></iframe></div>
    <div class="section"><a href="index.html">← 메인으로</a></div>
    <script>
    const sections=document.querySelectorAll('.section');
    window.addEventListener('scroll',()=>{
    sections.forEach(sec=>{
    if(sec.getBoundingClientRect().top<window.innerHeight-100){ sec.classList.add('show'); }
    });
    });
    </script>
    </body>
    </html>
