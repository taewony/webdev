<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>인간 회귀</title>
<style>
body { margin:0; color:white; font-family:Arial; background:url(https://i.namu.wiki/i/d1L8doz691tTWe2tPpt-BwnlR02T7Dziog5Sm8Yudr0tqFG1HCuOhSZ3-Dt0lgwR5RC2rIcSGlkxdvjozGsINPARgL2t_mDB5JpnSbhIffrZWENmXdxqkwflahuMAzzn2CvrOjT-Ygv0uMn8SsttWQ.webp) center; }
.section { height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; opacity:0; transform:translateY(50px); transition:1s; }
.section.show { opacity:1; transform:translateY(0); }
a { color:red; }
</style>
</head>
<body>
<div class="section"><h1>"마지막 불사, 처단하겠습니다. 인간으로서 살아가 주십시오."</h1></div>
<div class="section"><h2>분기 조건</h2><p>에마 관련 이벤트 진행</p></div>
<div class="section"><h2>엔딩 설명</h2><p>쿠로를 살리고 인간으로 돌아가는 희망적인 엔딩</p></div>
<div class="section"><iframe width="700" height="400" src="https://www.youtube.com/embed/DLsssDFlTXE?t=3000s"></iframe></div>
<div class="section"><a href="index.html">← 메인으로</a></div>
<script>
const sections=document.querySelectorAll('.section');
window.addEventListener('scroll',()=>{
 sections.forEach(sec=>{
  if(sec.getBoundingClientRect().top<window.innerHeight-100){ sec.classList.add('show'); }
 });
});
</script>
</body>
</html>
