<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>유상현의 첫 웹 페이지</title>
    <style>
        body {
            background-color: #f4f7f9; 
            font-family: 'Malgun Gothic', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            text-align: center; 
        }

        header {
            background-color: #3498db; 
            color: white;
            padding: 40px 20px;
        }

        section {
            background-color: white;
            margin: 30px auto;
            padding: 20px;
            width: 80%;
            max-width: 500px;
            border-radius: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }

        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            display: inline-block;
            padding-bottom: 5px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            margin: 10px 0;
            font-size: 1.1rem;
        }

        footer {
            margin-top: 50px;
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>안녕하세요 저는 유상현 입니다</h1>
        <p>저는 운동하는 것을 좋아합니다</p>
    </header>

    <section id="about">
        <h2>좌우명</h2>
        <p>좌우명은 착하게 살자 입니다</p>
    </section>

    <section id="interests">
        <h2>내가 좋아하는 것</h2>
        <ul>
            <li>🏐 배구하는 것</li>
            <li>🌊 친구들과 노는 것</li>
            <li>💻 게임하는 것</li>
        </ul>
    </section>

    <footer>
        <p>이메일: ushsang@gmail.com</p>
    </footer>

</body>
</html>
