<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attribute - CSS Selector</title>
    <style>
      p[title] {
        color: red;
        span {
          font-size: 20px;
          font-weight: bold;
        }
        a[target] {
          color: blue;
          text-decoration: none;
        }
        a[target="_self"] {
          background-color: silver;
        }
        a[class^="inner_"] {
          font-style: italic;
          font-weight: bold;
        }
      }
    </style>
  </head>

  <body>
    <p title="This is a title">
      Title - <span class="inner_big">This is a big text: </span>
      <a href="" class="inner_sm">link</a>
      <a href="" target="_blank">naver</a>
      <a href="" target="_blank">daum</a>
      <a href="" target="_self" class="inner_big">google</a>
    </p>
  </body>
</html>
