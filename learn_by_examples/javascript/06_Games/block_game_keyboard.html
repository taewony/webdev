<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Canvas Game Loop</title>
</head>
<body>
  <canvas id="myCanvas" width="600" height="400"
    style="border: 2px solid #cef"></canvas>

  <script>
    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");

    // 공(ball)
    let x = 50;
    let y = 50;
    let dx = 3;
    let dy = 3;
    const size = 20;

    // 바(paddle)
    const paddleWidth = 100;
    const paddleHeight = 10;
    let paddleX = (canvas.width - paddleWidth) / 2;
    const paddleY = canvas.height - 20;
    const paddleSpeed = 6;

    // 키 입력 상태
    let rightPressed = false;
    let leftPressed = false;

    // 게임 상태
    let isGameOver = false;

    // 키 이벤트
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") rightPressed = true;
      if (e.key === "ArrowLeft") leftPressed = true;
    });

    document.addEventListener("keyup", (e) => {
      if (e.key === "ArrowRight") rightPressed = false;
      if (e.key === "ArrowLeft") leftPressed = false;
    });

    // 상태 업데이트
    function update() {
      if (isGameOver) return;

      // 바 이동
      if (rightPressed) paddleX += paddleSpeed;
      if (leftPressed) paddleX -= paddleSpeed;

      // 바가 화면 밖으로 나가지 않도록 제한
      if (paddleX < 0) paddleX = 0;
      if (paddleX + paddleWidth > canvas.width)
        paddleX = canvas.width - paddleWidth;

      // 공 이동
      x += dx;
      y += dy;

      // 좌우 벽 반사
      if (x + size > canvas.width || x < 0) {
        dx = -dx;
      }

      // 위쪽 벽 반사
      if (y < 0) {
        dy = -dy;
      }

      // 바와 충돌
      if (
        y + size >= paddleY &&
        x + size > paddleX &&
        x < paddleX + paddleWidth
      ) {
        dy = -dy;
        y = paddleY - size;
      }

      // 바를 놓치면 게임 종료
      if (y + size > canvas.height) {
        isGameOver = true;
      }
    }

    // 화면 그리기
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 공
      if (!isGameOver) {
        ctx.fillStyle = "blue";
        ctx.fillRect(x, y, size, size);
      }

      // 바
      ctx.fillStyle = "black";
      ctx.fillRect(paddleX, paddleY, paddleWidth, paddleHeight);

      // 게임 오버
      if (isGameOver) {
        ctx.font = "30px Arial";
        ctx.fillStyle = "red";
        ctx.fillText("Game Over", 220, 200);
      }
    }

    // 게임 루프
    function game_loop() {
      update();
      render();
      requestAnimationFrame(game_loop);
    }

    game_loop();
  </script>
</body>
</html>
