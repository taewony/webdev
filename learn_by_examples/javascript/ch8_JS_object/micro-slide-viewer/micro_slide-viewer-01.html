<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>마이크로 슬라이드 뷰어</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="presentation-deck">
        <section class="slide active">
            <h1>첫 번째 슬라이드</h1>
            <p>웹 프로그래밍의 기초를 배웁니다.</p>
        </section>
        <section class="slide">
            <h1>두 번째 슬라이드</h1>
            <p>HTML, CSS, JS의 역할을 분리합니다.</p>
        </section>
        <section class="slide">
            <h1>세 번째 슬라이드</h1>
            <p>Q&A 시간입니다.</p>
        </section>
    </main>

    <nav class="controls">
        <button id="prevBtn" disabled>이전</button>
        <span id="pageIndicator">1 / 3</span>
        <button id="nextBtn">다음</button>
    </nav>

    <script src="app.js"></script>

</html>
