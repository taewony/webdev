<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXE. Fashion Store</title>
    
    <!-- 1. Load Tailwind CSS (No build step required) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. Load Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom Config for specific DSL requirements -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Custom styles for things Tailwind default doesn't cover easily */
        body { font-family: 'Inter', sans-serif; }
        
        /* Smooth hover transition for the card DSL requirement */
        .product-card { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .product-card:hover { transform: scale(1.02); }
        
        /* Loading Spinner */
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #000;
            width: 24px;
            height: 24px;
            -webkit-animation: spin 1s linear infinite; /* Safari */
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Range Slider Styling */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #000000;
            cursor: pointer;
            margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #e5e7eb;
            border-radius: 2px;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <!-- Navbar -->
    <nav class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-4">
                    <button id="mobile-menu-btn" class="p-2 -ml-2 hover:bg-gray-100 rounded-full lg:hidden">
                        <i data-lucide="menu"></i>
                    </button>
                    <h1 class="text-2xl font-bold tracking-tight font-serif">LUXE.</h1>
                </div>
                <button class="p-2 hover:bg-gray-100 rounded-full">
                    <i data-lucide="shopping-bag"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Layout -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Mobile Filter Bar -->
        <div class="lg:hidden mb-6 flex justify-between items-center bg-white p-4 rounded-lg shadow-sm">
            <span class="font-medium text-gray-900" id="item-count-mobile">9 Items</span>
            <button id="mobile-filter-trigger" class="flex items-center gap-2 text-sm font-medium text-gray-700">
                <i data-lucide="filter" class="w-4 h-4"></i> Filters
            </button>
        </div>

        <div class="flex gap-8 items-start">
            
            <!-- Sidebar (Desktop + Mobile Drawer) -->
            <!-- DSL: layout: "Collapse on mobile but keep key filters visible" -->
            <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden"></div>
            
            <aside id="sidebar" class="fixed lg:sticky lg:top-24 top-0 left-0 z-50 h-full lg:h-[calc(100vh-8rem)] w-72 bg-white lg:bg-transparent p-6 lg:p-0 shadow-2xl lg:shadow-none overflow-y-auto transition-transform duration-300 ease-in-out -translate-x-full lg:translate-x-0">
                <div class="flex justify-between items-center lg:hidden mb-6">
                    <h2 class="text-xl font-bold font-serif">Filters</h2>
                    <button id="close-sidebar">
                        <i data-lucide="x"></i>
                    </button>
                </div>

                <div class="space-y-8 pr-4">
                    <!-- Categories -->
                    <div>
                        <h3 class="font-semibold text-gray-900 mb-4 uppercase text-xs tracking-wider">Categories</h3>
                        <ul class="space-y-3" id="category-list">
                            <!-- Injected by JS -->
                        </ul>
                    </div>

                    <!-- Price Range -->
                    <div>
                        <h3 class="font-semibold text-gray-900 mb-4 uppercase text-xs tracking-wider">Price Range</h3>
                        <input type="range" min="0" max="300" value="150" class="w-full h-1 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                        <div class="flex justify-between mt-2 text-sm text-gray-600">
                            <span>$0</span>
                            <span>$150+</span>
                        </div>
                    </div>

                    <!-- Colors -->
                    <div>
                        <h3 class="font-semibold text-gray-900 mb-4 uppercase text-xs tracking-wider">Colors</h3>
                        <div class="flex flex-wrap gap-3" id="color-list">
                            <!-- Injected by JS -->
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Product Grid Area -->
            <div class="flex-1 w-full">
                <div class="mb-6 hidden lg:flex justify-between items-center">
                    <h2 class="text-2xl font-light text-gray-900">New Arrivals</h2>
                    <span class="text-gray-500 text-sm" id="item-count-desktop">9 products found</span>
                </div>

                <!-- Product Grid Container -->
                <!-- DSL: container: flexbox(wrap: true, gap: 16px) -->
                <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 lg:gap-8">
                    <!-- Products injected here by JS -->
                </div>

                <!-- Infinite Scroll Loader -->
                <div id="loading-indicator" class="py-12 flex justify-center w-full opacity-0 transition-opacity">
                    <div class="flex flex-col items-center gap-2">
                        <div class="loader"></div>
                        <span class="text-xs text-gray-500 uppercase tracking-widest">Loading more styles...</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- JavaScript Implementation -->
    <script>
        // --- Mock Data ---
        const categories = ["New Arrivals", "Dresses", "Tops", "Denim", "Outerwear", "Accessories"];
        const colors = ["#000000", "#FFFFFF", "#1e3a8a", "#f5f5dc", "#dc2626", "#556b2f"];
        
        let products = [
            { id: 1, name: "Silk Blend Midi Dress", price: 129.00, rating: 4.8, image: "https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&q=80&w=800" },
            { id: 2, name: "Oversized Wool Blazer", price: 185.00, rating: 4.9, image: "https://images.unsplash.com/photo-1591047139829-d91aecb6caea?auto=format&fit=crop&q=80&w=800" },
            { id: 3, name: "Classic Straight Leg Jeans", price: 95.00, rating: 4.5, image: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?auto=format&fit=crop&q=80&w=800" },
            { id: 4, name: "Ribbed Knit Sweater", price: 65.00, rating: 4.7, image: "https://images.unsplash.com/photo-1576566588028-4147f3842f27?auto=format&fit=crop&q=80&w=800" },
            { id: 5, name: "Leather Crossbody Bag", price: 145.00, rating: 4.6, image: "https://images.unsplash.com/photo-1548036328-c9fa89d128fa?auto=format&fit=crop&q=80&w=800" },
            { id: 6, name: "Linen Button Shirt", price: 55.00, rating: 4.3, image: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?auto=format&fit=crop&q=80&w=800" },
            { id: 7, name: "Pleated Maxi Skirt", price: 78.00, rating: 4.4, image: "https://images.unsplash.com/photo-1583496661160-fb5886a0aaaa?auto=format&fit=crop&q=80&w=800" },
            { id: 8, name: "Cashmere Scarf", price: 45.00, rating: 4.9, image: "https://images.unsplash.com/photo-1520908695049-2233b00f4729?auto=format&fit=crop&q=80&w=800" },
            { id: 9, name: "Denim Jacket", price: 110.00, rating: 4.2, image: "https://images.unsplash.com/photo-1543087903-1ac2ec7aa8c5?auto=format&fit=crop&q=80&w=800" },
        ];

        // --- Render Functions ---

        function renderStars(rating) {
            let starsHtml = '';
            for (let i = 0; i < 5; i++) {
                const fillClass = i < Math.floor(rating) ? "fill-yellow-400 text-yellow-400" : "text-gray-300";
                starsHtml += `<i data-lucide="star" class="w-3.5 h-3.5 ${fillClass}"></i>`;
            }
            return `<div class="flex items-center space-x-0.5">${starsHtml}<span class="text-xs text-gray-500 ml-1">(${rating})</span></div>`;
        }

        function createProductCard(product) {
            // DSL: hover_effects: { transform: scale(1.02) } -> handled by .product-card CSS
            // DSL: WishlistButton { position: top-right } -> handled by absolute positioning
            return `
                <div class="product-card group relative bg-white rounded-lg cursor-pointer flex flex-col h-full shadow-sm hover:shadow-xl">
                    <button class="wishlist-btn absolute top-3 right-3 p-2 rounded-full bg-white/80 backdrop-blur-sm hover:bg-white transition-all shadow-sm z-10 text-gray-600 hover:text-red-500">
                        <i data-lucide="heart" class="w-4 h-4"></i>
                    </button>
                    
                    <div class="aspect-[3/4] overflow-hidden rounded-t-lg bg-gray-100 relative">
                        <img src="${product.image}" alt="${product.name}" 
                            class="w-full h-full object-cover object-center transition-opacity duration-300 group-hover:opacity-95"
                            onerror="this.src='https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&q=80&w=800'">
                    </div>
                    
                    <div class="p-4 flex flex-col flex-grow">
                        <div class="flex justify-between items-start mb-1">
                            <h3 class="text-md font-medium text-gray-900 line-clamp-1">${product.name}</h3>
                        </div>
                        
                        <div class="mb-2">
                            ${renderStars(product.rating)}
                        </div>
                        
                        <div class="mt-auto flex justify-between items-center">
                            <p class="text-lg font-semibold text-gray-900">$${product.price.toFixed(2)}</p>
                            <button class="opacity-0 group-hover:opacity-100 transition-opacity duration-200 bg-black text-white px-4 py-2 text-xs font-medium uppercase tracking-wider rounded">
                                Quick Add
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSidebar() {
            // Categories
            const catList = document.getElementById('category-list');
            catList.innerHTML = categories.map((cat, i) => `
                <li class="flex items-center">
                    <input type="checkbox" id="cat-${i}" class="rounded border-gray-300 text-black focus:ring-black">
                    <label for="cat-${i}" class="ml-2 text-gray-600 hover:text-black cursor-pointer text-sm">${cat}</label>
                </li>
            `).join('');

            // Colors
            const colorList = document.getElementById('color-list');
            colorList.innerHTML = colors.map((hex, i) => `
                <button class="w-8 h-8 rounded-full border border-gray-200 shadow-sm transition-transform hover:scale-110 focus:ring-2 focus:ring-offset-2 focus:ring-black"
                    style="background-color: ${hex}"></button>
            `).join('');
        }

        function appendProducts(newProducts) {
            const grid = document.getElementById('product-grid');
            newProducts.forEach(p => {
                // Convert string to DOM node to append
                const template = document.createElement('template');
                template.innerHTML = createProductCard(p).trim();
                grid.appendChild(template.content.firstChild);
            });
            
            // Re-initialize icons for newly added elements
            lucide.createIcons();
            updateCounts();
        }

        function updateCounts() {
            const count = document.querySelectorAll('.product-card').length;
            document.getElementById('item-count-desktop').innerText = `${count} products found`;
            document.getElementById('item-count-mobile').innerText = `${count} Items`;
        }

        // --- Interaction Logic ---

        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            appendProducts(products); // Initial load

            // Mobile Sidebar Toggle
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            
            function toggleSidebar() {
                const isOpen = !sidebar.classList.contains('-translate-x-full');
                if (isOpen) {
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                } else {
                    sidebar.classList.remove('-translate-x-full');
                    overlay.classList.remove('hidden');
                }
            }

            document.getElementById('mobile-menu-btn').addEventListener('click', toggleSidebar);
            document.getElementById('mobile-filter-trigger').addEventListener('click', toggleSidebar);
            document.getElementById('close-sidebar').addEventListener('click', toggleSidebar);
            overlay.addEventListener('click', toggleSidebar);

            // Wishlist Toggle (Event Delegation)
            document.getElementById('product-grid').addEventListener('click', (e) => {
                const btn = e.target.closest('.wishlist-btn');
                if (btn) {
                    e.preventDefault();
                    e.stopPropagation();
                    const icon = btn.querySelector('svg');
                    
                    if (btn.classList.contains('text-red-500')) {
                        btn.classList.remove('text-red-500');
                        btn.classList.add('text-gray-600');
                        icon.classList.remove('fill-current');
                    } else {
                        btn.classList.add('text-red-500');
                        btn.classList.remove('text-gray-600');
                        icon.classList.add('fill-current');
                    }
                }
            });

            // Infinite Scroll Implementation
            let isLoading = false;
            window.addEventListener('scroll', () => {
                const { scrollTop, scrollHeight, clientHeight } = document.documentElement;
                
                // DSL: "Infinite scroll - maintain shopping momentum"
                if (scrollTop + clientHeight >= scrollHeight - 300 && !isLoading) {
                    isLoading = true;
                    document.getElementById('loading-indicator').classList.remove('opacity-0');
                    
                    // Simulate API delay
                    setTimeout(() => {
                        const newBatch = products.map(p => ({
                            ...p, 
                            id: Math.random(), 
                            name: p.name + " (More)" 
                        }));
                        
                        appendProducts(newBatch);
                        isLoading = false;
                        document.getElementById('loading-indicator').classList.add('opacity-0');
                    }, 1000);
                }
            });
        });
    </script>
</body>
</html>
