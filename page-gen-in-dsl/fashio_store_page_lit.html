<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LUXE Fashion Store</title>

    <script type="module">
      import {
        LitElement,
        html,
        css,
      } from "https://unpkg.com/lit@3/index.js?module";

      const PRODUCTS = [
        {
          id: 1,
          name: "Silk Blend Midi Dress",
          price: 129,
          rating: 4.8,
          image:
            "https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&q=80&w=800",
        },
        {
          id: 2,
          name: "Oversized Wool Blazer",
          price: 185,
          rating: 4.9,
          image:
            "https://images.unsplash.com/photo-1591047139829-d91aecb6caea?auto=format&fit=crop&q=80&w=800",
        },
        {
          id: 3,
          name: "Classic Straight Leg Jeans",
          price: 95,
          rating: 4.5,
          image:
            "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?auto=format&fit=crop&q=80&w=800",
        },
      ];

      class LuxePage extends LitElement {
        static styles = css`
          :host {
            display: block;
            background: #fafafa;
            font-family: system-ui, sans-serif;
            color: #111;
          }

          header {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #eee;
            z-index: 10;
          }

          .nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 16px;
            height: 64px;
            display: flex;
            justify-content: space-between;
            align-items: center;
          }

          main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 16px;
          }

          .layout {
            display: flex;
            gap: 32px;
            align-items: flex-start;
          }

          aside {
            width: 240px;
            background: white;
            padding: 16px;
            border-radius: 8px;
            position: sticky;
            top: 96px;
            height: fit-content;
          }

          .product-area {
            flex: 1;
          }

          /* === DSL semantic: Event delegation root (ProductGrid container) === */
          .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 24px;
          }

          .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition:
              transform 0.25s ease,
              box-shadow 0.25s ease;
            position: relative; /* wishlist absolute positioning anchor */
          }

          .card:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
          }

          .card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
          }

          .card-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex: 1;
          }

          .price {
            font-weight: 600;
            margin-top: auto;
          }

          /* === Wishlist Button Styles (Design Token Layer) === */

          .wishlist-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: grid;
            place-items: center;
          }

          /* DSL state: inactive */
          .wishlist-btn.inactive {
            color: #666;
          }

          /* DSL state: active */
          .wishlist-btn.active {
            color: #dc2626;
          }

          svg.outline {
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
          }

          svg.filled {
            fill: currentColor;
          }

          @media (max-width: 768px) {
            .layout {
              flex-direction: column;
            }
            aside {
              width: 100%;
              position: static;
            }
          }
        `;

        /* ============================================================
           DSL semantic:
             behavior wishlist_toggle {
               on click
               from ProductGrid
               when target matches ".wishlist-btn"
               effects { toggle_class self, toggle_class child svg }
             }
           ============================================================ */
        onWishlistClick(e) {
          // DSL: when target matches ".wishlist-btn"
          const btn = e.target.closest(".wishlist-btn");
          if (!btn) return;

          // DSL: effects { prevent_default, stop_propagation }
          e.preventDefault();
          e.stopPropagation();

          // DSL: toggle_class self { active / inactive }
          btn.classList.toggle("active");
          btn.classList.toggle("inactive");

          // DSL: toggle_class child "svg" { filled / outline }
          const icon = btn.querySelector("svg");
          if (icon) {
            icon.classList.toggle("filled");
            icon.classList.toggle("outline");
          }
        }

        renderCard(p) {
          return html`
            <article class="card">
              <!-- DSL target element: .wishlist-btn -->
              <button
                class="wishlist-btn inactive"
                aria-label="Add to wishlist"
              >
                <svg class="outline" width="18" height="18" viewBox="0 0 24 24">
                  <path
                    d="M12 21s-6.716-4.338-9.428-7.05C.86 12.238.5 10.805.5 9.25.5 6.35 2.85 4 5.75 4c1.74 0 3.41.81 4.5 2.09C11.34 4.81 13.01 4 14.75 4 17.65 4 20 6.35 20 9.25c0 1.555-.36 2.988-2.072 4.7C18.716 16.662 12 21 12 21z"
                  />
                </svg>
              </button>

              <img src="${p.image}" />
              <div class="card-body">
                <h3>${p.name}</h3>
                <div>⭐ ${p.rating}</div>
                <div class="price">$${p.price}</div>
              </div>
            </article>
          `;
        }

        render() {
          return html`
            <header>
              <div class="nav">
                <h1>LUXE.</h1>
                <div>👜</div>
              </div>
            </header>

            <main>
              <div class="layout">
                <aside>
                  <h3>Filters</h3>
                  <section>
                    <strong>Categories</strong>
                    <ul>
                      <li><input type="checkbox" /> Dresses</li>
                      <li><input type="checkbox" /> Tops</li>
                    </ul>
                  </section>
                </aside>

                <section class="product-area">
                  <h2>New Arrivals</h2>

                  <!-- DSL semantic: from ProductGrid (delegation root) -->
                  <div class="grid" @click=${this.onWishlistClick}>
                    ${PRODUCTS.map((p) => this.renderCard(p))}
                  </div>
                </section>
              </div>
            </main>
          `;
        }
      }

      customElements.define("luxe-page", LuxePage);
    </script>
  </head>

  <body>
    <luxe-page></luxe-page>
  </body>
</html>
