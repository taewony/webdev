<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        /* Flexbox 컨테이너 */
        display: flex;
        /* flex-direction: row-reverse; 기본값 */
        flex-direction: column-reverse;
        margin: 10px 10px;
        /* display: inline-flex; */
        height: 300px;

        .item {
          /* Flexbox 아이템 */
          padding: 20px;
          background-color: #f0f0f0;
          border: #ccc 1px solid;
          text-align: center;
        }
      }
      .flex-wrap {
        display: flex;
        flex-wrap: wrap;
        margin: 10px 0;

        .item {
          /* Flexbox 아이템 */
          padding: 20px;
          background-color: #859c90;
          border: #ccc 1px solid;
          text-align: center;
          width: 200px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item">Item 1</div>
      <div class="item">Item 2</div>
      <div class="item">Item 3</div>
    </div>
    <div class="flex-wrap">
      <div class="item">Item 4</div>
      <div class="item">Item 5</div>
      <div class="item">Item 6</div>
    </div>
  </body>
</html>
