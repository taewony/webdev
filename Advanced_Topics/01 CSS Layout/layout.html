<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox 2단 레이아웃 샘플</title>
    <style>
      /* 전체 페이지 기본 스타일 (Reset) */
      body {
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f0f2f5;
        color: #333;
      }

      /* Header & Footer */
      header,
      footer {
        background-color: #2c3e50;
        color: white;
        text-align: center;
        padding: 20px;
      }

      /* 네비게이션 영역 (CSS 네스팅 적용) */
      nav {
        background-color: #fff;
        border-bottom: 1px solid #ddd;
        padding: 15px 20px;

        ul {
          list-style: none; /* 기본 불릿 기호 제거 */
          margin: 0;
          padding: 0;
          display: flex; /* 자식인 li들을 가로로 배치 */
          justify-content: center; /* 가운데 정렬 */
          gap: 30px; /* 메뉴 간격 */

          li {
            font-weight: bold;
            color: #555;
            cursor: pointer;

            /* 호버 상태 네스팅 (&는 자기 자신을 의미) */
            &:hover {
              color: #3498db;
            }
          }
        }
      }

      /* 메인 영역 (CSS 네스팅 & 2단 레이아웃 적용) */
      main {
        /* 화면 가운데 정렬 및 최대 넓이 제한 */
        max-width: 1000px;
        margin: 30px auto;

        /* 2단 배치를 위한 Flexbox 선언 */
        display: flex;
        gap: 20px; /* 왼쪽 section과 오른쪽 aside 사이의 간격 */

        /* 시각적 확인을 위해 최소 높이 지정 */
        min-height: 500px;

        /* 왼쪽 고정 영역 */
        section {
          width: 250px; /* 고정 크기 (닻 역할) */
          background-color: #fff;
          padding: 20px;
          border-radius: 8px;
          box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        /* 오른쪽 가변 영역 */
        aside {
          flex: auto; /* 남은 공간을 모두 차지 (스펀지 역할) */
          background-color: #fff;
          padding: 20px;
          border-radius: 8px;
          box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>나의 웹사이트 로고</h1>
    </header>

    <nav>
      <ul>
        <li>홈</li>
        <li>프로필</li>
        <li>포트폴리오</li>
        <li>연락처</li>
      </ul>
    </nav>

    <main>
      <section>
        <h3>사이드 메뉴</h3>
        <p>
          이 영역은 250px로 고정되어 있습니다. 화면을 늘리거나 줄여도 이 폭은
          유지됩니다.
        </p>
      </section>

      <aside>
        <h2>메인 콘텐츠 영역</h2>
        <p>
          이 영역은 flex: auto; 가 적용되어 남은 가로 공간을 모두 유연하게
          채웁니다.
        </p>
        <p>
          브라우저 창의 크기를 조절해 보시면 이 영역만 고무줄처럼 늘어났다
          줄어드는 것을 보실 수 있습니다.
        </p>
      </aside>
    </main>

    <footer>
      <p>&copy; 2026 My Website Layout Sample</p>
    </footer>
  </body>
</html>
