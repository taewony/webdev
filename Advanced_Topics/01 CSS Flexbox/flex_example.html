<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* 1. 기본 초기화 */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      /* 공통 헤더/푸터 스타일 */
      header,
      footer {
        padding: 1.5rem;
        background: hsl(0, 0%, 30%);
        color: white;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>My Website</h1>
    </header>
    <main class="container">
      <section>
        <h2>About</h2>
        <p>This is a simple website layout using Flexbox.</p>
      </section>
      <aside>
        <h2>Contact</h2>
        <p>You can reach me at myemail@example.com.</p>
      </aside>
    </main>
    <footer>
      <p>&copy; 2023 My Website</p>
    </footer>
  </body>
</html>
