<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>if-else 조건문 사용하기</title>
  <link rel="stylesheet" href="style_js.css">
<body>
  <script>
let drink = prompt("이거 마시면 사귀는 거다!");
let str = null;
if (drink == 'yes') str = "오늘부터 1일 시작";
else str = "헤어진다";
document.write("술마신다아: " + drink + "<hr>");
document.write(str)

let ostr = (drink == 'yes') ? "오늘부터 1일 시작" : "헤어진다";
document.write(ostr);
  </script>
</body>
</html>
