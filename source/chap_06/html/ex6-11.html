<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>다중 반복문으로 구구단 출력하기</title>
  <link rel="stylesheet" href="style_js.css">
<body>
  <script>
    let dan, num;
    for (dan = 2; dan < 10; dan++){
      document.write(dan + "단: ");  
      for (num = 1; num < 10; num++){
        document.write(dan + "X" + num +  "=" + dan * num + " ");
      }
      document.write("<hr>");
    }

    // ===== 입력 (Input) =====
let startDan = 2, endDan = 9;
let startNum = 1, endNum = 9;

// ===== 처리 (Processing) =====
let output = "";

for (let dan = startDan; dan <= endDan; dan++) {
  // 단 제목 추가
  output += dan + "단: ";

  // 구구셈 계산식 추가
  for (let num = startNum; num <= endNum; num++) {
    output += dan + "X" + num + "=" + (dan * num) + " ";
  }

  // 단 구분선 추가
  output += "<hr>";
}

// ===== 출력 (Output) =====
document.write(output);

  </script>
</body>
</html>
