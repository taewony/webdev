<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>캔버스 사용하기</title>
  </head>
  <body>
    <canvas id="canvas" width="500" height="200"></canvas>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      let x = 0;
      // 상태 업데이트
      function update() {
        x += 2;
      }

      // 화면 그리기
      function render() {
        // 1. 화면 지우기 (clear)
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 2. 객체 그리기
        ctx.fillStyle = "red";
        ctx.fillRect(x, 50, 50, 50);
      }
      function game_loop() {
        // 게임 루프
        update();
        render();
        requestAnimationFrame(game_loop);
      }
      game_loop(); // 게임 시작
    </script>
  </body>
</html>
