<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>이벤트 리스너 사용하기</title>
    <link rel="stylesheet" href="style_js.css" />
    <style>
      body {
        text-align: center;
      }
      #rotateImage {
        transition: transform 1s;
      }
    </style>
  </head>
  <body>
    <h4>이미지를 클릭해보세요</h4>
    <img id="img" src="https://via.placeholder.com/150" />

    <script>
      const image = document.getElementById("img");

      // 첫 번째 핸들러
      image.addEventListener("mouseover", function () {
        console.log("handler 1: 로그 출력");
      });

      // 두 번째 핸들러
      image.addEventListener("mouseover", function () {
        console.log("handler 2: 스타일 변경");
        image.style.border = "3px solid red";
      });

      // 세 번째 핸들러
      image.addEventListener("mouseover", function () {
        console.log("handler 3: 크기 변경");
        image.style.transform = "scale(1.2)";
      });
    </script>
  </body>
</html>
